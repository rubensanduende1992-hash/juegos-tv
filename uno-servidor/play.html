<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UNO – Control</title><link rel="stylesheet" href="/style.css"></head>
<body><div id="app"><div class="pn phone"><h2>Conectando con la TV…</h2></div></div><script src="/common.js"></script><script>
let id=localStorage.uid||'',s,pend=null,sel=-1,last='',tm;
function poll(){fetch('/state?id='+encodeURIComponent(id),{cache:'no-store'}).then(r=>{if(!r.ok)throw 0;return r.json()}).then(j=>{const k=JSON.stringify(j);if(k!==last){last=k;s=j;show()}}).catch(()=>{if(!s)$('#app').innerHTML='<div class="pn phone"><h2>Conectando con la TV…</h2><p>Revisá que estés en la misma Wi-Fi que la TV.</p></div>'})}
function connect(){clearInterval(tm);poll();tm=setInterval(poll,600)}
const post=b=>fetch('/act',{method:'POST',body:JSON.stringify({id,...b})}).then(r=>r.json());
function join(){post({t:'join',name:$('#nm').value,code:$('#cd').value,ch:sel}).then(r=>{if(r.err){$('#er').textContent=r.err;return}id=r.id;localStorage.uid=id;connect()})}
const act=(t,x={})=>{post({t,...x}).then(poll)};
function pickCh(j){if(!s.players.some(p=>p.ch===j)){sel=j;show()}}
function clk(cid){const c=s.hand.find(x=>x.id===cid);if(!c||!c.ok)return;if(c.c==='W'){pend=cid;show();return}act('play',{cid})}
function pick(col){const cid=pend;pend=null;act('play',{cid,col})}
function show(){const A=$('#app');
if(s.me<0){const taken=s.players.map(p=>p.ch);if(!$('#jf')){A.innerHTML=`<div class="pn phone" id="jf"><h1>🃏 UNO</h1><input id="nm" placeholder="Tu nombre" maxlength="12"><input id="cd" placeholder="Código de la TV" maxlength="4" style="text-transform:uppercase" value="${E((new URLSearchParams(location.search).get('c')||'').slice(0,4))}"><p>Elegí tu personaje:</p><div id="cg" class="cgrid"></div><p id="er" style="color:#ff8a80"></p><button class="b go" style="width:100%" onclick="join()">Entrar</button></div>`}
if(sel<0||taken.includes(sel))sel=CH.findIndex((c,j)=>!taken.includes(j));$('#cg').innerHTML=CH.map((c,j)=>`<div class="cp ${j==sel?'on':''} ${taken.includes(j)?'tk':''}" onclick="pickCh(${j})"><img src="/chars/${j}.webp"><span>${c[1]}</span></div>`).join('');return}
const me=s.players[s.me];
if(s.phase==='lobby'){A.innerHTML=`<div class="pn phone"><h2>${av(me.ch,'xs')} ${E(me.name)}</h2><div class="row">${s.players.map(p=>`<div class="lp">${av(p.ch,'xs')}${E(p.name)}</div>`).join('')}</div>${s.me===0?`<p>Elegí el mazo:</p><div class="row">${D.map((d,i)=>`<div class="sw ${s.deck==i?'on':''}" onclick="act('deck',{i:${i}})">${bk(i,'sm')}<span>${d[0]}</span></div>`).join('')}</div><button class="b go" style="width:100%;margin-top:12px" ${s.players.length<2?'disabled':''} onclick="act('start')">Empezar partida</button>`:'<p>Esperando que el Jugador 1 empiece…</p>'}</div>`;return}
const mine=s.me===s.turn&&!s.over,hand=s.hand.slice().sort((a,b)=>'RYGBW'.indexOf(a.c)-'RYGBW'.indexOf(b.c)||(+a.v||50)-(+b.v||50));
const st=s.over?'Terminó la ronda':mine?(s.drawn!=null?'Robaste: jugá esa carta o pasá':'¡Es tu turno!'):'Turno de '+E(s.players[s.turn].name);
A.innerHTML=`<div class="pn phone"><b>${av(me.ch,'xs')} ${E(me.name)}</b> · ${me.sc} pts<br>${st}<div class="hand">${hand.map(c=>cardH(c,mine&&c.ok?'ok':'dim',`onclick="clk(${c.id})"`)).join('')}</div>
${pend!=null?`<div class="row">${'RYGB'.split('').map(c=>`<button class="b" style="background:${CC[c]};color:${c=='Y'?'#222':'#fff'}" onclick="pick('${c}')">${{R:'Rojo',Y:'Amarillo',G:'Verde',B:'Azul'}[c]}</button>`).join('')}</div>`:`<div class="row"><button class="b" ${mine&&s.drawn==null?'':'disabled'} onclick="act('draw')">Robar</button>${mine&&s.drawn!=null?`<button class="b" onclick="act('pass')">Pasar</button>`:''}<button class="b" ${me.n<=2&&!s.over?'':'disabled'} onclick="act('uno')" style="background:#e50914;border-color:#e50914;color:#ffd800">¡UNO!</button>${s.vul?`<button class="b" onclick="act('cazar')">¡Cazar!</button>`:''}</div>`}
${s.over?`<div class="win" style="margin-top:10px">🏆 ${E(s.players[s.win.i].name)} gana (+${s.win.pts})${s.me===0?`<div class="row" style="justify-content:center;margin-top:8px"><button class="b" onclick="act('again')">Otra ronda</button><button class="b" onclick="act('menu')">Menú</button></div>`:''}</div>`:''}</div>`}
connect();
</script></body></html>
