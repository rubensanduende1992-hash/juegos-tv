<!doctype html><html lang="es"><head><meta charset="utf-8"><title>El juego del impostor · TV</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Barlow+Condensed:wght@500;700&display=swap">
<style>
html,body{margin:0;height:100%;background:#000;color:#ece4d2;font:500 30.7px 'Barlow Condensed',system-ui,sans-serif;overflow:hidden}
#fit{position:fixed;top:0;right:0;bottom:0;left:0;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#000}#s{position:relative;overflow:hidden;width:1280px;height:720px;flex:none;background:#06040c;font-size:31px}.qq{margin-right:20px;width:300px;text-align:center;font-size:28px}.qq div{width:270px;margin:0 auto 6px}.qq small{display:block;font-size:20px;color:#9c95a8}
#s>*{position:absolute}#st{top:0;left:0;width:100%;height:100%}#tmr{top:14px;right:24px;font:700 34px 'Barlow Condensed',system-ui,sans-serif;text-shadow:0 2px 6px #000;z-index:300}.bg{top:0;right:0;bottom:0;left:0;width:100%;height:100%;object-fit:cover;transition:filter 1s}.sh{top:0;right:0;bottom:0;left:0;background:#0a1030;opacity:0;transition:opacity 1.2s;mix-blend-mode:multiply}
.night .sh{opacity:.55}.night .sp img{filter:brightness(.62) saturate(.8)}.day .bg{filter:brightness(1.45) saturate(.75)}
.sp{position:absolute;transform:translateX(-50%);text-align:center;transition:opacity .8s}.sp img{display:block;margin:0 auto;transform-origin:bottom}.br img{animation:br 3.2s ease-in-out infinite}@keyframes br{50%{transform:scaleY(1.02)}}
.nm{font-size:15.8px;text-shadow:0 1px 3px #000;white-space:nowrap}.dd .nm{text-decoration:line-through;color:#d99}.cand .nm{color:#ffd36b;font-weight:700}
#bn{top:0;right:0;bottom:0;left:0;display:grid;place-items:center;text-align:center;padding:51.2px;font:400 79.4px/1.1 'Special Elite',serif;text-shadow:0 .51.2px 25.6px #000;opacity:0;pointer-events:none}
#bn.on{animation:bn 3.6s forwards}@keyframes bn{0%{opacity:0;transform:scale(.96)}15%,78%{opacity:1;transform:scale(1)}100%{opacity:0}}
#fl{top:0;right:0;bottom:0;left:0;opacity:0;pointer-events:none}#fl.on{animation:fl .55s 3}@keyframes fl{50%{opacity:.55}}
.pn{top:5%;right:5%;bottom:5%;left:5%;background:#0b0912ee;border:1px solid #3a3552;display:flex;gap:38.4px;padding:38.4px;align-items:center;font-size:33.3px}.pn[hidden]{display:none}
.qr{width:332.8px;height:332.8px;background:#fff}.cod{font:400 89.6px 'Special Elite';letter-spacing:.102.4px}.sl{display:grid;grid-template-columns:1fr 1fr;gap:12.8px;margin-top:19.2px}.sl i{font-style:normal;border:1px solid #3a3552;padding:.76.8px 15.4px;border-radius:6px}
#vt{left:22%;right:22%;top:14px;background:#000a;padding:15.4px;text-align:center}#vt b{display:block;height:15.4px;background:#2d2842;margin-top:.102.4px}#vt i{display:block;height:100%;background:#c6283a;transition:width .6s}
#ov{top:0;right:0;bottom:0;left:0;background:radial-gradient(circle,#0003 15%,#000d 80%);display:flex;align-items:center;justify-content:center;gap:38.4px;text-align:center}#ov[hidden]{display:none}#ov img{height:576.0px}#ov p{font:400 53.8px/1.2 'Special Elite';margin:0;max-width:512.0px}
#go{top:0;right:0;bottom:0;left:0;background:#000d;display:grid;place-items:center;font:400 64.0px 'Special Elite';cursor:pointer}
.bb{position:absolute;left:50%;bottom:100%;margin-bottom:6px;transform:translateX(-50%);width:230px;background:#fff;color:#16121f;border-radius:14px;padding:8px 12px;font:700 21px/1.15 'Barlow Condensed',system-ui,sans-serif;text-align:center;z-index:200;box-shadow:0 3px 10px #0008}.bb.acc{background:#fff2f2;border:3px solid #c6283a}.bb:after{content:'';position:absolute;left:50%;top:100%;margin-left:-9px;border:9px solid transparent;border-top-color:#fff}.bb.acc:after{border-top-color:#c6283a}.tg img{filter:drop-shadow(0 0 12px #ff3b5c)}.tg .nm{color:#ffd36b;font-weight:700}
</style></head><body><div id="fit"><div id="s">
<img class="bg" id="bg" alt=""><div class="sh"></div><div id="st"></div><div id="tmr"></div>
<div class="pn" id="lb" hidden><div class="qq"><div id="q1"></div>Con la app</div><div class="qq"><div id="q2"></div>Sin la app<small id="ipt"></small></div><div><div>Entrá con tu celular. Código:</div><div class="cod" id="cd">····</div><div class="sl" id="sl"></div><p id="hint">El 1.º en entrar empieza desde su celu, o presioná OK en el control remoto.</p></div></div>
<div id="vt" hidden>Votación en curso <span id="vc"></span><b><i id="vb" style="width:0"></i></b></div>
<div id="ov" hidden></div><div id="bn"></div><div id="fl"></div></div></div>
<script src="/qr.js"></script><script src="/impostor/game.js"></script><script src="/impostor/audio.js"></script><script src="/impostor-host.js"></script>
<script>
const $=s=>document.querySelector(s),ROL={impostor:'IMPOSTOR',policia:'POLICÍA',medico:'MÉDICO',ninguno:'SIN ACCIÓN'};
let M,S={},tick=0,fall={},built='',tmr=0,endDone=0;
const pos=i=>i%2?{x:10+23*((i-1)/2),b:20,k:.78}:{x:21+23*(i/2),b:3,k:.9};
let ip='127.0.0.1';try{ip=Android.ip()}catch(e){}const HOST=ip+':3000';
const qr=x=>{try{const q=new __QR.QRCode(-1,__QR.ECL.M);q.addData(x);q.make();const n=q.getModuleCount(),m=3;let d='';for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))d+=`M${c+m},${r+m}h1v1h-1z`;return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${n+2*m} ${n+2*m}" shape-rendering="crispEdges" style="background:#fff;border-radius:10px"><path d="${d}" fill="#000"/></svg>`}catch(e){return ''}};
const fm=t=>Math.floor(t/60)+':'+String(t%60).padStart(2,'0');
setInterval(()=>{const e=$('#tmr');if(!e)return;const t=Math.ceil((S.left||0)-(Date.now()-(S.t0||0))/1000),n={night:'Noche',day:'Debate',vote:'Votación'}[S.phase];e.textContent=n&&t>0?n+' · '+fm(t):''},500);
function fit(){$('#s').style.transform='scale('+Math.min(innerWidth/1280,innerHeight/720)+')'}addEventListener('resize',fit);fit();
fetch('/impostor/manifest.json').then(r=>r.json()).then(m=>{M=m;A.preload(M.audio);A.unlock();onChange()});
window.onChange=()=>{if(!M)return;try{S=JSON.parse(hostView(''));S.t0=Date.now();render()}catch(e){document.body.innerHTML='<pre style="color:#fff;background:#b00020;padding:2vh;white-space:pre-wrap">Error en El juego del impostor:\n'+String(e&&e.stack||e)+'</pre>'}try{Android.changed()}catch(e){}};
window.onEv=m=>{if(!m.to)ev(m)};
document.addEventListener('keydown',e=>{A.unlock();if((e.key==='Enter'||e.keyCode===23||e.keyCode===66)&&S.phase==='lobby'&&S.players&&S.players.length)start()});
function banner(t,c){const b=$('#bn');b.textContent=t;b.style.color=c||'#ece4d2';b.className='';void b.offsetWidth;b.className='on'}
function flash(c){const f=$('#fl');f.style.background=c;f.className='';void f.offsetWidth;f.className='on'}
const nm=id=>(S.players.find(p=>p.id===id)||{}).name||'';
function on(m){
  if(m.t==='room'){code=m.code;$('#cd').textContent=code;$('#qr').src='/qr/'+code+'.svg'}
  else if(m.t==='state'){S=m;render()}
  else if(m.t==='ev')ev(m)}
function build(){const k=S.players.map(p=>p.id).join();if(built===k)return;built=k;
  $('#st').innerHTML=S.players.map((p,i)=>{const q=pos(i);return `<div class="sp br" id="s${p.id}" style="left:${q.x}%;bottom:${q.b}%;z-index:${100-q.b}"><img alt=""><div class="nm">${p.name}</div></div>`}).join('')}
function render(){
  if(S.phase!=='end')endDone=0;
  const pre=S.phase==='lobby';$('#lb').hidden=!pre;
  if(pre){$('#cd').textContent=S.code;$('#q1').innerHTML=qr('unotv://'+HOST+'/sala?c='+S.code+'&g=impostor');$('#q2').innerHTML=qr('http://'+HOST+'/impostor-play.html?c='+S.code);$('#ipt').textContent=ip;$('#sl').innerHTML=(S.players||[]).map(p=>`<i>${p.name}</i>`).join('');return}
  build();const bg=$('#bg'),u='/impostor/esc/'+S.scene+'.jpg';if(!bg.src.endsWith(u))bg.src=u;
  $('#s').className=S.phase==='night'?'night':(S.phase==='day'||S.phase==='vote')?'day':'';
  const al=S.players.filter(p=>p.alive).length;$('#vt').hidden=S.phase!=='vote';$('#vc').textContent=(S.voted||0)+'/'+al;$('#vb').style.width=((S.voted||0)/al*100)+'%';
  A.music(S.phase==='lobby'?'m_lobby':S.phase==='vote'?'m_vote':S.phase==='end'?(S.kind==='descubridores'?'m_win':'m_lose'):'m_play'+(1+(S.round%2)));
  clearTimeout(tmr);if(S.phase==='vote'&&S.left){const w=S.left*1000-10000;if(w>0)tmr=setTimeout(()=>A.say('ten'),w)}
  S.players.forEach(p=>{const e=$('#s'+p.id);e.classList.toggle('dd',!p.alive);e.classList.toggle('cand',!!(S.cands&&S.cands.includes(p.id)))});
  if(S.phase==='end')endScreen()}
function ev(m){
  const L=m.name;
  if(L==='start'){A.say('start',1)}
  else if(L==='night'){banner('LA NOCHE HA COMENZADO');$('#ov').hidden=true}
  else if(L==='death'){fall[m.player]=Date.now();banner(nm(m.player).toUpperCase()+' HA MUERTO','#ff6677');flash('#c6283a');A.say('dead1',1);A.say('dead2',1)}
  else if(L==='saved'){banner('EL MÉDICO SALVÓ A ALGUIEN ESTA NOCHE','#d0a64a');flash('#d0a64a');A.say('saved',1)}
  else if(L==='day'){banner('EL DÍA HA COMENZADO');$('#ov').hidden=true}
  else if(L==='vote'){banner('VOTACIÓN');A.say('votestart',1)}
  else if(L==='endvote'){A.say('endvote',1)}
  else if(L==='tie'){banner('EMPATE · SEGUNDA VOTACIÓN');A.say('tie',1)}
  else if(L==='none'){banner('NADIE FUE EXPULSADO');A.say('none',1)}
  else if(L==='expel'){A.say('exp',1);const o=$('#ov');o.hidden=false;o.innerHTML=`<img src="/impostor/cards/${m.card}.jpg" alt=""><p>${m.who} fue expulsado.<br>Su rol era: ${ROL[m.role]}</p>`;setTimeout(()=>o.hidden=true,5500)}
  else if(L==='say')say(m);
  else if(L==='off'){A.say('off')}else if(L==='on'){A.say('on')}}
const spk={};
function say(m){const e=$('#s'+m.player);if(!e)return;let b=e.querySelector('.bb');if(!b){b=document.createElement('div');e.appendChild(b)}
  b.className='bb'+(m.target?' acc':'');b.textContent=m.text;clearTimeout(b._t);b._t=setTimeout(()=>{if(b.parentNode)b.parentNode.removeChild(b)},3800);spk[m.player]=Date.now()+3500;
  if(m.target){const t=$('#s'+m.target);if(t){t.classList.add('tg');setTimeout(()=>t.classList.remove('tg'),3500)}}}
function endScreen(){const o=$('#ov'),w=S.winners||[];o.hidden=false;
  o.innerHTML=`<p>${S.kind==='descubridores'?'¡Descubrieron al impostor!<br>Ganan: '+w.map(nm).join(', '):'El impostor ganó.<br>Ganador: '+w.map(nm).join(', ')}<br><small>${S.players.map(p=>p.name+': '+ROL[p.role]).join(' · ')}</small></p>`;
  if(!endDone){endDone=1;banner(S.kind==='descubridores'?'VICTORIA':'EL IMPOSTOR GANÓ','#d0a64a');A.say(S.kind==='descubridores'?'innwin':'impwin',1)}}
setInterval(()=>{tick++;if(!M||!S.players||!S.scene)return;S.players.forEach(p=>{
  const c=M.chars[p.char],e=$('#s'+p.id);if(!c||!e)return;const i=S.players.indexOf(p);let f,br=1;
  const fl=fall[p.id]&&Date.now()-fall[p.id]<900;
  if(!p.alive||fl){br=0;f=fl?(c.gest[c.gest.length-1]):c.dead}
  else if(S.phase==='end'||(spk[p.id]||0)>Date.now()){const g=c.gest.slice(0,-1);f=g[(tick>>1)%g.length]}
  else if(S.phase==='vote'||S.phase==='night')f=c.views[(tick>>2)%5];else f=c.views[0];
  const im=e.firstChild,u='/impostor/'+f.f;if(!im.src.endsWith(u))im.src=u;im.style.height=(f.h*pos(i).k)+'px';e.classList.toggle('br',!!br)})},150);
</script></body></html>
