<!doctype html><html lang="es"><head><meta charset="utf-8"><title>El juego del impostor</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Barlow+Condensed:wght@500;700&display=swap">
<style>
:root{--u:1vh;--blood:#c6283a;--brass:#d0a64a;--dim:#9c95a8}*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#050508;color:#ece4d2;font:500 calc(var(--u)*5.5) 'Barlow Condensed',system-ui,sans-serif;overflow:hidden;touch-action:manipulation}
#app{grid-template-columns:minmax(0,1fr);position:fixed;top:0;right:0;bottom:0;left:0;display:grid;grid-template-rows:auto 1fr auto;font-size:calc(var(--u)*6);background:linear-gradient(160deg,#050b26,#0a1a5a 55%,#050b26);padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#app.full{grid-template-rows:1fr;padding:0}
button,input{font:inherit;color:inherit}
.pb,.ft{display:flex;justify-content:space-between;align-items:center;gap:3vw;padding:calc(var(--u)*2) 4vw;background:#050a1ecc}.ft{font-size:calc(var(--u)*5.5);color:var(--dim)}
.chip{background:var(--brass);color:#1a1200;padding:0 2vw;border-radius:4px;font-weight:700}.dot{display:inline-block;width:calc(var(--u)*2);height:calc(var(--u)*2);border-radius:50%;background:#5fbf8f;margin-right:1vw}.dot.off{background:#c6283a}
.ctr{margin:auto;text-align:center;font-size:calc(var(--u)*8);display:flex;flex-direction:column;gap:calc(var(--u)*2);align-items:center;padding:0 4vw}.big{font:400 calc(var(--u)*28)/1 'Special Elite'}.red{color:#ff5566}.gold{color:var(--brass)}.dim{color:var(--dim)}
.bd{display:flex;gap:2vw;padding:calc(var(--u)*2) 3vw;min-height:0;align-items:stretch}.row{display:flex;gap:1.2vw;flex:1;min-width:0}
.pt{position:relative;align-items:center;justify-content:center;flex:1;min-width:0;display:flex;padding:0;border:0;border-radius:10px;background:none;overflow:hidden}.pt img{width:100%;height:100%;object-fit:contain}.pt.sel{box-shadow:0 0 0 3px #fff,0 0 16px 4px #ff3b5c}
.side{display:flex;flex-direction:column;justify-content:center;gap:calc(var(--u)*2);width:30vw;text-align:center;font-size:calc(var(--u)*7)}
.bt{font:700 calc(var(--u)*9) 'Barlow Condensed';padding:calc(var(--u)*1.4) 3vw;border:0;border-radius:12px;background:#b32a50;color:#f3dfe8}.bt.cf{background:var(--brass);color:#1a1200}.bt:disabled{opacity:.35}
.jn{display:flex;flex-direction:column;gap:calc(var(--u)*2.5);margin:auto;width:60vw}.jn input{background:#0a1030;border:2px solid #1e6bff;border-radius:10px;padding:calc(var(--u)*1.5) 2vw;font-size:calc(var(--u)*8);text-transform:none}
.cw{position:relative;width:100%;height:calc(var(--u)*100);background:#000;overflow:hidden;display:grid;place-items:center}.cwb{position:absolute;top:-5%;right:-5%;bottom:-5%;left:-5%;width:110%;height:110%;object-fit:cover;filter:blur(22px) brightness(.55)}
.cwi{position:relative;height:100%;aspect-ratio:16/9;max-width:100%}.cwi>img{position:absolute;top:0;right:0;bottom:0;left:0;width:100%;height:100%}
.hit{position:absolute;left:22.7%;top:63.8%;width:54.4%;height:22.3%;background:none;border:0;border-radius:12%;cursor:pointer;padding:0}.hit:focus-visible{outline:3px solid #fff}
.sbox{position:absolute;left:30%;top:10%;width:40%;height:54%;display:grid;place-items:end center}.halo{position:absolute;top:-8%;right:-10%;bottom:0;left:-10%;background:radial-gradient(ellipse at 50% 55%,#2e72ff99,#0000 68%)}
.sbox .sil{position:relative;max-height:100%;max-width:100%;filter:drop-shadow(0 0 calc(var(--u)*1.4) #4aa8ff)}.rv{animation:rv .8s ease-out}@keyframes rv{0%{filter:brightness(4);transform:scale(.94)}100%{filter:none;transform:none}}
#fl{position:fixed;top:0;right:0;bottom:0;left:0;opacity:0;pointer-events:none;z-index:9}#fl.on{animation:fl .55s 3}@keyframes fl{50%{opacity:.55}}
#nt{position:fixed;top:0;right:0;bottom:0;left:0;z-index:8;background:#050510e6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*2);text-align:center;font:400 calc(var(--u)*8)/1.1 'Special Elite',serif;padding:0 5vw}#nt[hidden]{display:none}#nt img{max-height:calc(var(--u)*34);max-width:70vw;object-fit:contain}
.buzz{animation:bz .4s 3}@keyframes bz{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
#rot{display:none;position:fixed;top:0;right:0;bottom:0;left:0;z-index:20;background:#050508;place-items:center;text-align:center;font:400 6vw 'Special Elite';padding:8vw}@media(orientation:portrait){#rot{display:grid}}
@media(prefers-reduced-motion:reduce){#fl.on,.buzz,.rv{animation:none}}
.tw{position:relative;height:100%;aspect-ratio:162/610;max-width:100%}.tw img{display:block;width:100%;height:100%}
.nl{position:absolute;left:4%;right:4%;bottom:1.8%;height:13.5%;background:#070a1c;color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',system-ui,sans-serif;font-weight:700;line-height:1;white-space:nowrap;overflow:hidden;border-radius:0 0 8px 8px}
.bd,.pb,.ft{min-width:0}
</style></head><body><div id="app"></div><div id="fl"></div><div id="nt" hidden></div><div id="rot">Girá el celular en horizontal para jugar</div>
<script src="/impostor/audio.js"></script>
<script>
function setU(){document.documentElement.style.setProperty('--u',(innerHeight/100)+'px')}setU();addEventListener('resize',setU);addEventListener('orientationchange',function(){setTimeout(setU,250)});
const $=s=>document.querySelector(s),Q=new URLSearchParams(location.search),SM={policia:0,medica:1,desconocida:2,empresaria:3,profesor:4,periodista:5,bombero:6,delincuente:2};
let M,id=localStorage.imp_uid||'',me=null,code=(Q.get('c')||'').toUpperCase(),nameV=localStorage.juegostv_name||'',S={},dl=0,okc=0,last='',lastN=-1,sel='',step=0,acted=0,voted=0,res=null,key='',spun=0,err='',ntT=0,joining=0,gen=0,curCode='';
const cid=(function(){try{let c=localStorage.imp_cid;if(!c){c=Math.random().toString(36).slice(2)+Date.now().toString(36);localStorage.imp_cid=c}return c}catch(e){return Math.random().toString(36).slice(2)}})();
const P=pid=>(S.players||[]).find(x=>x.id===pid)||{},vib=v=>{try{navigator.vibrate&&navigator.vibrate(v)}catch(e){}},sy=(i,k)=>A.say(i,k);
const post=b=>fetch('/act',{method:'POST',body:JSON.stringify(Object.assign({id},b))}).then(r=>r.json());
try{AndroidPhone.landscape(true)}catch(e){}
fetch('/impostor/manifest.json').then(r=>r.json()).then(m=>{M=m;A.preload(['join','press','pick','role','hasmuerto','expme','disc','winner','loser','emit','confirm']);poll();setInterval(poll,600);render()});
function poll(){const g=gen;fetch('/state?id='+encodeURIComponent(id),{cache:'no-store'}).then(r=>{if(!r.ok)throw 0;return r.json()}).then(j=>{if(g!==gen)return;okc=1;
  if(j.game==='home'){location.replace('/control.html');return}if(j.game==='truco'){location.replace('/truco-play.html?c='+j.code);return}if(j.game==='domino'){location.replace('/domino-play.html?c='+j.code);return}if(j.game!=='impostor'){location.replace('/play.html?c='+j.code);return}
  dl=Date.now()+j.left*1000;const k=JSON.stringify(Object.assign({},j,{left:0}));if(k===last)return;last=k;apply(j)}).catch(()=>{okc=0;render()})}
function apply(j){S=j;if(j.code!==curCode){curCode=j.code;spun=0;lastN=-1} // sala nueva: se vuelve a sortear
 me=j.me>=0?id:null;
 if(j.me<0&&id&&!joining){id='';try{localStorage.imp_uid=''}catch(e){}}
 if(j.me<0&&code&&nameV&&!joining&&!err)return doJoin();
 const k=j.phase+j.round+(j.cands||'');if(k!==key){key=k;sel='';step=0;acted=0;voted=0;res=null}
 if(lastN<0)lastN=j.en;(j.evs||[]).forEach(e=>{if(e.n>lastN){lastN=e.n;ev(e)}});render()}
function doJoin(){if(joining)return;joining=1;post({t:'join',code,name:nameV,cid}).then(r=>{joining=0;gen++;if(r.err){err=r.err;render();return}id=r.id;try{localStorage.imp_uid=id}catch(e){}A.sfx('join');last='';poll()}).catch(()=>{joining=0})}
function fx(c,p){const f=$('#fl');f.style.background=c;f.className='';void f.offsetWidth;f.className='on';vib(p);const a=$('#app');a.classList.remove('buzz');void a.offsetWidth;a.classList.add('buzz')}
function show(h,c,p,ms=5000){const n=$('#nt');n.innerHTML=h;n.hidden=false;fx(c,p);clearTimeout(ntT);ntT=setTimeout(()=>n.hidden=true,ms)}
const lay=pid=>`<img src="/impostor/${M.chars[P(pid).char].dead.f}" alt="">`;
function ev(m){const L=m.name,mine=m.player===me;
  if(L==='death'&&!mine)show(lay(m.player)+`<div class="red">${P(m.player).name.toUpperCase()} HA MUERTO</div>`,'#c6283a',[300,100,300,100,500]);
  else if(L==='dead'){show(`<div style="font-size:calc(var(--u)*24)">DEAD</div>${lay(me)}<div class="red">HAS MUERTO</div>`,'#c6283a',[500,150,500,150,800]);sy('hasmuerto',1)}
  else if(L==='saved')show('<div class="gold">EL MÉDICO SALVÓ A ALGUIEN ESTA NOCHE</div>','#d0a64a',[120,60,120],4500);
  else if(L==='expel'&&!mine)show(`${m.who} FUE EXPULSADO`,'#555',[200,80,200]);
  else if(L==='expelled'){show('<div class="red">HAS SIDO EXPULSADO</div>','#c6283a',[400,150,400,150,600]);sy('expme',1)}
  else if(L==='discovered')sy('disc',1);
  else if(L==='tie')show('EMPATE<br>SEGUNDA VOTACIÓN','#fff',[80,50,80],3500);else if(L==='none')show('NADIE FUE EXPULSADO','#555',[150],3500);
  else if(L==='night')show('LA NOCHE HA COMENZADO','#555',[80],2500);else if(L==='day')show('EL DÍA HA COMENZADO','#fff',[60],2500);else if(L==='vote')show('VOTACIÓN','#fff',[80],2000);
  else if(L==='winner'){fx('#d0a64a',[100,50,100,50,400]);sy('winner',1)}else if(L==='loser'){fx('#555',[500]);sy('loser',1)}}
const fmt=t=>Math.floor(t/60)+':'+String(t%60).padStart(2,'0');
const bar=(l,tm)=>`<div class="pb"><span class="chip">${l}</span><span><i class="dot ${okc?'':'off'}"></i>${P(me).name||nameV} · ${okc?'conectado':'reconectando…'}</span><b id="tm">${tm?fmt(Math.max(0,Math.round((dl-Date.now())/1000))):''}</b></div>`;
const foot=()=>`<div class="ft"><span>Sin avisos</span><span>EL JUEGO DEL IMPOSTOR</span></div>`;
const ctr=h=>`<div class="ctr">${h}</div>`;
function tiles(){const y=S.you||{};return (S.players||[]).filter(p=>p.alive&&(p.id!==me||(S.phase==='night'&&y.role==='medico'&&!y.selfUsed))&&(!S.cands||S.cands.includes(p.id)))
  .map(p=>`<button class="pt${sel===p.id?' sel':''}" data-id="${p.id}" aria-label="${p.name}"><div class="tw"><img src="/impostor/tiles/${p.char}.webp" alt=""><span class="nl" style="font-size:calc(var(--u)*${p.name.length>7?3.3:4.6})">${p.name}</span></div></button>`).join('')}
function render(){
  const app=$('#app');if(!M)return;
  if(!me){app.className='';app.innerHTML=`<div></div><div class="jn"><div class="ctr" style="font-size:calc(var(--u)*9)">El juego del impostor</div><input id="nm" placeholder="Tu nombre" maxlength="14" value="${nameV}" autocomplete="off"><input id="cd" placeholder="Código de sala" maxlength="4" value="${code}" autocapitalize="characters" autocomplete="off"><button class="bt cf" data-a="join">ENTRAR</button><div class="red">${err}</div></div><div></div>`;return}
  const y=S.you||{},p=P(me);
  if(!S.phase||S.phase==='lobby'){app.className='';app.innerHTML=bar('Sala')+ctr(`Sala ${S.code}<br><span class="dim">${(S.players||[]).length} en la sala. Esperando que empiece…</span>${S.first?'<button class="bt cf" data-a="start">EMPEZAR PARTIDA</button>':''}`)+foot();return}
  if(S.phase==='roll'){if(spun===1)return;app.className='full';
    app.innerHTML=spun===2?`<div class="cw"><img class="cwb" src="/impostor/cards/${y.card}.jpg" alt=""><div class="cwi"><img class="rv" src="/impostor/cards/${y.card}.jpg" alt="Tu rol"></div></div>`
      :`<div class="cw"><img class="cwb" id="azb" src="/impostor/cards/azar.jpg" alt=""><div class="cwi"><img id="az" src="/impostor/cards/azar.jpg" alt=""><div class="sbox"><div class="halo" hidden></div><img class="sil" id="sil" hidden alt=""></div><button class="hit" data-a="spin" aria-label="Tocá al azar"></button></div></div>`;return}
  app.className='';let b,lab={night:'Noche',day:'Día',vote:'Votación',end:'Fin'}[S.phase];
  if(S.phase==='end'){const w=(S.winners||[]).includes(me);app.className='';app.innerHTML=ctr(w?'<div class="big gold">WINNER</div>'+(S.kind==='descubridores'?'Descubriste al impostor':'Ganaste'):'<div class="big red">LOSER</div>Perdiste');return}
  if(!p.alive)b=ctr('Modo espectador<br><span class="dim">Mirás la partida en la TV</span>');
  else if(S.phase==='night'){const L={impostor:'ELIMINAR',policia:'INVESTIGAR',medico:'PROTEGER'}[y.role];
    if(!L)b=ctr('Es de noche. Dormís.<br><span class="dim">Esperá al amanecer.</span>');
    else if(acted)b=ctr(res?(res.impostor?'<span class="red">'+P(res.target).name+': ES EL IMPOSTOR</span>':P(res.target).name+': NO es el impostor'):'Acción enviada. Esperá al amanecer.');
    else b=`<div class="bd"><div class="row">${tiles()}</div><div class="side">${sel?P(sel).name:'Elegí a un jugador'}<button class="bt${step?' cf':''}" data-a="act" ${sel?'':'disabled'}>${step?'CONFIRMAR':L}</button></div></div>`}
  else if(S.phase==='day')b=ctr('Debate en curso<br><span class="dim">Acusá y defendete en voz alta</span>'+(S.chat||[]).map(c=>'<div style="font-size:calc(var(--u)*5.5);max-width:92vw"><b class="gold">'+c.name+':</b> '+c.text+'</div>').join('')+(S.ready?'<span class="gold">Esperando a los demás…</span>':'<button class="bt cf" data-a="ready">LISTO PARA VOTAR</button>'));
  else b=voted?ctr('Voto enviado. Esperando al resto…'):`<div class="bd"><div class="row">${tiles()}</div><div class="side">${sel?P(sel).name:'¿A quién expulsás?'}<button class="bt${step?' cf':''}" data-a="vote" ${sel?'':'disabled'}>${step?'¿SEGURO?':'CONFIRMAR VOTO'}</button></div></div>`;
  app.innerHTML=bar(lab,S.phase!=='end')+b+foot()}
function spin(){if(spun)return;spun=1;A.unlock();A.sfx('pick');const az=$('#az'),azb=$('#azb'),sil=$('#sil'),hl=$('.halo'),fin=SM[S.you.card],N=18;
  $('.hit').hidden=true;az.src=azb.src='/impostor/cards/azar_plate.jpg';sil.hidden=hl.hidden=false;let k=0,last=-1;
  const st=()=>{if(k>=N){sil.src='/impostor/sil/'+fin+'.webp';vib([200]);return setTimeout(()=>{spun=2;post({t:'roll'});sy('role',1);fx('#d0a64a',[300,100,300]);render()},700)}
    let n;do n=Math.floor(Math.random()*8);while(n==last||(k==N-1&&n==fin));last=n;sil.src='/impostor/sil/'+n+'.webp';vib(15);k++;setTimeout(st,60+k*k*1.7)};st()}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;A.unlock();
  if(b.dataset.id){sel=b.dataset.id;step=0;A.sfx('emit');render()}
  else if(b.dataset.a==='join'){nameV=$('#nm').value.trim()||'Jugador';code=$('#cd').value.trim().toUpperCase();err='';try{localStorage.juegostv_name=nameV}catch(x){}A.sfx('press');doJoin()}
  else if(b.dataset.a==='ready')post({t:'ready'}).then(poll);
  else if(b.dataset.a==='start')post({t:'start'}).then(poll);
  else if(b.dataset.a==='spin')spin();
  else if(b.dataset.a==='act'){if(!step){step=1;render()}else post({t:'act',target:sel}).then(r=>{if(r.err){step=0;render();return}res=r.result||null;acted=1;render()})}
  else if(b.dataset.a==='vote'){if(!step){step=1;render()}else{A.sfx('confirm');post({t:'vote',target:sel}).then(r=>{if(!r.err){voted=1;render()}})}}});
setInterval(()=>{const t=$('#tm');if(t&&dl&&S.phase!=='end')t.textContent=fmt(Math.max(0,Math.round((dl-Date.now())/1000)))},500);
</script></body></html>
