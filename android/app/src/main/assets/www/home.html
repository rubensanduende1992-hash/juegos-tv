<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Juegos TV</title>
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0;background:#000;overflow:hidden}
#st{position:absolute;left:50%;top:50%;width:min(100vw,177.78vh);aspect-ratio:1672/941;transform:translate(-50%,-50%);background:url(/games/seleccion.webp) 0 0/100% 100%}
.tile{position:absolute;outline:none;cursor:pointer;border-radius:4.2%/7.4%;transition:box-shadow .2s}
.tile:after{content:"";position:absolute;inset:0;border-radius:inherit;background:rgba(0,0,0,.42);transition:opacity .2s}
.tile:focus:after,.tile:hover:after{opacity:0}
.tile:focus,.tile:hover{box-shadow:0 0 0 .5vh #fff3b0,0 0 4vh 1.2vh rgba(255,215,90,.95)}
.hint{position:absolute;left:0;right:0;bottom:.4%;text-align:center;font:600 1.7vh system-ui,Arial,sans-serif;color:#ffe9b0;text-shadow:0 .2vh .6vh #000}
</style></head><body><div id="st">
<div class="tile" tabindex="0" data-go="/truco" style="left:1.1%;top:21.3%;width:48.1%;height:72.5%" aria-label="Truco"></div>
<div class="tile" tabindex="0" data-go="/uno" style="left:51.2%;top:21.3%;width:47.8%;height:72.5%" aria-label="UNO"></div>
<div class="hint">◀ ▶ moverse &nbsp;·&nbsp; OK elegir &nbsp;·&nbsp; Atrás: volver al menú</div></div>
<script>
const T=[...document.querySelectorAll('.tile')],go=t=>{location.href=t.dataset.go};
T.forEach(t=>t.onclick=()=>go(t));
document.addEventListener('keydown',e=>{const i=Math.max(0,T.indexOf(document.activeElement));
 if(e.key==='ArrowRight'||e.keyCode===22){T[(i+1)%T.length].focus();e.preventDefault()}
 else if(e.key==='ArrowLeft'||e.keyCode===21){T[(i-1+T.length)%T.length].focus();e.preventDefault()}
 else if(e.key==='Enter'||e.keyCode===23||e.keyCode===66){go(T[i]);e.preventDefault()}});
T[0].focus();
</script></body></html>
