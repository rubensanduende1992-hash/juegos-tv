<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Juegos TV</title>
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0;background:#000;overflow:hidden;font-family:system-ui,Arial,sans-serif}
#st{position:absolute;left:50%;top:50%;width:min(100vw,177.78vh);aspect-ratio:1672/941;transform:translate(-50%,-50%);background:url(/games/seleccion.webp) 0 0/100% 100%;font-size:min(1vw,1.7778vh)}
.tile{position:absolute;top:21.3%;height:72.5%;cursor:pointer;border-radius:4.2%/7.4%;transition:box-shadow .2s}
.tile:after{content:"";position:absolute;inset:0;border-radius:inherit;background:rgba(0,0,0,.42);transition:opacity .2s}
.tile.on:after{opacity:0}
.tile.on{box-shadow:0 0 0 .6em #fff3b0,0 0 4em 1.2em rgba(255,215,90,.95)}
.qp{position:absolute;top:1.6%;width:11.5%;text-align:center;color:#fff;background:rgba(20,10,4,.78);border:.25em solid #c9962e;border-radius:1.2em;padding:.7em .5em .5em;font-size:1em}
.qp svg{width:100%;height:auto;display:block}.qp b{display:block;font-size:1.5em;margin-top:.3em}.qp small{display:block;font-size:1.1em;opacity:.85}
.chips{position:absolute;left:0;right:0;bottom:.5%;display:flex;gap:1em;justify-content:center;font-size:1.7em;font-weight:700;color:#ffe9b0;text-shadow:0 .1em .3em #000}
.chips span{background:rgba(20,10,4,.75);border:.12em solid #c9962e;border-radius:99px;padding:.1em .8em}
#ov{position:absolute;inset:0;display:none;place-items:center;background:rgba(0,0,0,.6);color:#ffe08a;font:900 6em "Arial Black",Impact,sans-serif;text-shadow:0 .08em .2em #000}
</style></head><body><div id="st">
<div class="tile" data-i="0" style="left:1.1%;width:48.1%" aria-label="Truco"></div>
<div class="tile" data-i="1" style="left:51.2%;width:47.8%" aria-label="UNO"></div>
<div class="qp" id="q1" style="left:1.2%"></div><div class="qp" id="q2" style="right:1.2%"></div>
<div class="chips" id="ch"></div><div id="ov"></div></div>
<script src="/qr.js"></script><script>
const E=s=>String(s).replace(/[&<>"]/g,c=>'&#'+c.charCodeAt(0)+';');
const qr=(t)=>{try{const q=new __QR.QRCode(-1,__QR.ECL.M);q.addData(t);q.make();const n=q.getModuleCount(),m=3;let d='';for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))d+=`M${c+m},${r+m}h1v1h-1z`;return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${n+2*m} ${n+2*m}" shape-rendering="crispEdges" style="background:#fff;border-radius:.6em"><path d="${d}" fill="#000"/></svg>`}catch(e){return ''}};
const code=Array.from({length:4},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ'[Math.random()*24|0]).join('');
let ip='127.0.0.1';try{ip=Android.ip()}catch(e){}
const GAMES=[{k:'truco',url:'/truco',n:'TRUCO'},{k:'uno',url:'/uno',n:'UNO'}],S={sel:0,launching:'',pl:[]},T=[...document.querySelectorAll('.tile')];
function hostView(id){const i=S.pl.findIndex(p=>p.id===id);return JSON.stringify({game:'home',sel:S.sel,launching:S.launching,code,urls:['http://'+ip+':3000/control.html'],players:S.pl.map(p=>p.name),me:i})}
function setSel(n){if(S.launching)return;S.sel=((n%2)+2)%2;render()}
function launch(){if(S.launching)return;const g=GAMES[S.sel];S.launching=g.k;render();setTimeout(()=>{location.href=g.url},1400)}
function hostAct(s){let r={};try{const b=JSON.parse(s),i=S.pl.findIndex(p=>p.id===b.id);
 if(b.t==='join'){const id=Math.random().toString(36).slice(2);S.pl.push({id,name:String(b.name||'Jugador').trim().slice(0,12)||'Jugador'});r={id}}
 else if(i<0)r={err:'Jugador desconocido'};else if(b.t==='move')setSel(S.sel+(+b.d>0?1:-1));else if(b.t==='ok')launch()}catch(e){r={err:'Error'}}
 render();return JSON.stringify(r)}
function render(){T.forEach((t,i)=>t.classList.toggle('on',i===S.sel));
 document.getElementById('ch').innerHTML=S.pl.map(p=>'<span>📱 '+E(p.name)+'</span>').join('');
 const o=document.getElementById('ov');o.style.display=S.launching?'grid':'none';o.textContent=S.launching?'¡'+GAMES.find(g=>g.k===S.launching).n+'!':'';
 try{Android.changed()}catch(e){}}
const host=ip+':3000';
document.getElementById('q1').innerHTML=qr('unotv://'+host+'/sala?g=home')+'<b>Con la app</b><small>controlá desde tu celular</small>';
document.getElementById('q2').innerHTML=qr('http://'+host+'/control.html')+'<b>Sin la app</b><small>'+E(ip)+'</small>';
T.forEach((t,i)=>t.onclick=()=>{S.sel=i;launch()});
document.addEventListener('keydown',e=>{
 if(e.key==='ArrowRight'||e.keyCode===22){setSel(S.sel+1);e.preventDefault()}
 else if(e.key==='ArrowLeft'||e.keyCode===21){setSel(S.sel-1);e.preventDefault()}
 else if(e.key==='Enter'||e.keyCode===23||e.keyCode===66){launch();e.preventDefault()}});
render();
</script></body></html>
