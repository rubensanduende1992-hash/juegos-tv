<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Dominó</title><link rel="stylesheet" href="/domino/dom.css">
<style>html,body{background:#06143a}.cj{display:flex;flex-direction:column;align-items:center;gap:2vh;padding-top:8vh}.cj input{font-size:8vh;text-align:center;width:50vw;border-radius:2vh;border:.4vh solid #4aa3ff;background:#0b1a4a;color:#fff;letter-spacing:1vh;text-transform:uppercase;padding:1vh}.er{color:#ff8a8a;font-size:4vh}</style></head>
<body class="pm"><div id="rot">🔄<br>Girá el celular<br>(modo horizontal)</div><div id="app"><div class="res"><p>Conectando con la TV…</p></div></div>
<script src="/domino/dom.js"></script><script>
const app=$('#app'),qs=new URLSearchParams(location.search),vib=a=>{try{navigator.vibrate&&navigator.vibrate(a)}catch(e){}};
try{AndroidPhone.landscape(true)}catch(e){}
let id=localStorage.dom_uid||'',s=null,last='',sel=-1,prevT=false,tt=0,dl=0,lastPh='',err='';
const post=b=>fetch('/act',{method:'POST',body:JSON.stringify(Object.assign({id},b))}).then(r=>r.json());
const snd=f=>{try{new Audio('/sonidos/domino/'+f+'.mp3').play()}catch(e){}};
function poll(){fetch('/state?id='+encodeURIComponent(id),{cache:'no-store'}).then(r=>{if(!r.ok)throw 0;return r.json()}).then(j=>{
 if(j.game==='home'){location.replace('/control.html');return}if(j.game==='truco'){location.replace('/truco-play.html?c='+j.code);return}if(j.game!=='domino'){location.replace('/play.html?c='+j.code);return}
 dl=Date.now()+j.left*1000;const k=JSON.stringify(Object.assign({},j,{left:0}));if(k===last)return;last=k;apply(j)}).catch(()=>{if(!s)app.innerHTML='<div class=res><p>Conectando con la TV…<br>Revisá que Dominó esté abierto en la TV y la misma Wi-Fi.</p></div>'})}
function apply(d){const my=d.turn===d.me&&d.phase=='play';
 if(my&&!prevT){tt=Date.now()+1900;vib([250,100,250,100,500]);setTimeout(rend,1950)}prevT=my;
 if(d.phase=='end'&&lastPh!='end'){const win=d.msg&&d.msg.w===d.me;vib(win?[500,150,500,150,900]:[300,120,300]);snd(win?'winner':'loser')}
 if(d.phase=='round'&&lastPh!='round')vib([150]);
 lastPh=d.phase;if(!my)sel=-1;s=d;rend()}
function rend(){const d=s;if(!d)return;const me=d.pl[d.me],host=d.me==0;let h='';
 if(d.me<0){if(!$('#cd'))app.innerHTML=`<div class="pv lb cj"><div style="font-weight:900;font-size:6vh">🎲 Dominó</div><div style="font-size:4vh">Código de sala</div><input id=cd maxlength=4 value="${E((qs.get('c')||'').toUpperCase())}"><div class=er id=er>${E(err)}</div><button style="background:#ffd23f;border:0;border-radius:30px;padding:1.2vh 6vh;font-size:6vh;font-weight:900" onclick="join()">Entrar</button></div>`;return}
 if(d.phase=='lobby'){h=`<div class="pv lb"><div style="font-weight:900;font-size:5vh">Elegí tu personaje</div><div>${[0,1,2,3,4,5].map(c=>`<div class="pk ${d.pl.some((p,i)=>p.char==c&&i!=d.me)?'x':''} ${me.char==c?'me':''}" data-pick=${c}><img src="/domino/av${c}.jpg"><br>${CH[c]}</div>`).join('')}</div>
 ${host?`<div><button data-go=1>▶ INICIAR</button></div>`:`<div style="font-size:4vh">${me.char>=0?'Listo ✔ esperando al anfitrión…':'Tocá un personaje'}</div>`}</div>`}
 else if(d.phase=='end'){const win=d.msg&&d.msg.w===d.me,v=d.votes.includes(d.me);h=`<div class=res style="background:${win?'radial-gradient(#ffe97a,#c88a00 70%)':'radial-gradient(#3a4a8a,#0a1030 75%)'};color:${win?'#fff59a':'#8fb0ff'}"><div class=lt></div><h1>${win?'WINNER':'LOSER'}</h1><p style="color:#fff">⭐ ${me.score}${win?'':' · ¡La próxima es tuya!'}</p><button data-ag=1>${v?'ESPERANDO…':'REVANCHA'}</button></div>`}
 else{const my=d.turn===d.me&&d.phase=='play',hand=d.hand,ch=d.chain,any=hand.some(t=>canPlay(t,ch).length),u=Math.max(6,Math.min(18,(innerWidth-40)/Math.max(ch.length,1)/2.3)),st=sel>=0&&hand[sel]?canPlay(hand[sel],ch):[];
 h=`<div class="pv ${d.mesa=='r'?'r':''}"><div class=bar><img src="/domino/av${me.char}.jpg"><span>${E(me.name)}<br>⭐ ${me.score}</span><span style="flex:1"></span>${d.pl.map((p,i)=>i==d.me?'':`<span class=c><img src="/domino/av${p.char}.jpg">${p.n}</span>`).join('')}<span class=c>🂠 ${d.pozo}</span></div>
 <div class=mini style="--u:${u}px">${ch.map(t=>tile(t[0],t[1],t[0]==t[1])).join('')}</div>
 <div class=ban>${d.phase=='round'?`🏆 ${E(d.msg.name)} +${d.msg.pts}⭐`:my?(st.length>1?'¿Dónde la ponés?':'¡TU TURNO!'):'Esperando…'}</div>
 <div class=hand>${hand.map((t,i)=>`<div class="tw ${my&&canPlay(t,ch).length?'ok':''} ${i==sel?'sel':''}" data-i=${i}>${tile(t[0],t[1],1)}</div>`).join('')}</div>
 <div class=acts>${my&&st.length>1?st.map(x=>`<button data-side=${x}>${x=='L'?'◀ IZQ':'DER ▶'}</button>`).join(''):''}${my&&!any&&d.pozo>0?'<button data-dr=1>ROBAR</button>':''}${my&&!any&&d.pozo==0?'<button data-ps=1>PASAR</button>':''}</div>
 <div id=pt style="width:${Math.max(0,(dl-Date.now())/200)}%"></div>${my?'<div class=lt></div>':''}${my&&tt>Date.now()?`<div class=tt data-tt=1><img src="/domino/tuturno.png"></div><div class=lt></div>`:''}</div>`}
 app.innerHTML=h}
function join(){const c=$('#cd').value.trim();err='';post({t:'join',code:c}).then(r=>{if(r.err){err=r.err;const e=$('#er');if(e)e.textContent=err;return}id=r.id;localStorage.dom_uid=id;last='';poll()})}
app.addEventListener('click',e=>{const t=e.target.closest('[data-pick],[data-tg],[data-go],[data-i],[data-side],[data-dr],[data-ps],[data-ag],[data-tt]');if(!t||!s)return;const D=t.dataset,my=s.turn===s.me&&s.phase=='play',hand=s.hand,go=b=>post(b).then(poll);
 if(D.pick!=null)go({t:'pick',c:+D.pick});else if(D.tg)go({t:'target',n:+D.tg});else if(D.go)go({t:'start'});else if(D.ag)go({t:'again'});else if(D.tt){tt=0;rend()}
 else if(D.dr)go({t:'draw'});else if(D.ps)go({t:'pass'});
 else if(D.i!=null&&my){const tl=hand[+D.i],o=canPlay(tl,s.chain),c=s.chain;if(!o.length)return;if(o.length==1||(c.length&&c[0][0]==c[c.length-1][1])){sel=-1;go({t:'play',tile:tl,side:o[0]})}else{sel=+D.i;rend()}}
 else if(D.side&&my&&sel>=0){const tl=hand[sel];sel=-1;go({t:'play',tile:tl,side:D.side})}});
setInterval(()=>{const b=$('#pt');if(b)b.style.width=Math.max(0,(dl-Date.now())/200)+'%'},400);
poll();setInterval(poll,700);
</script></body></html>
