<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dominó</title><link rel="stylesheet" href="/domino/dom.css"></head>
<body><div id="app"></div><script src="/qr.js"></script><script src="/domino/dom.js"></script><script src="/domino-host.js"></script><script>
const app=$('#app');let ip='127.0.0.1';try{ip=Android.ip()}catch(e){}const HOST=ip+':3000';
const qr=t=>{try{const q=new __QR.QRCode(-1,__QR.ECL.M);q.addData(t);q.make();const n=q.getModuleCount(),m=3;let d='';for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))d+=`M${c+m},${r+m}h1v1h-1z`;return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${n+2*m} ${n+2*m}" shape-rendering="crispEdges" style="background:#fff;border-radius:10px"><path d="${d}" fill="#000"/></svg>`}catch(e){return ''}};
let lastPh='',mus=null,last=0;
function music(){if(mus)return;const nx=()=>{const n=Math.random()<.5?1:2;mus=new Audio('/sonidos/domino/m'+n+'.mp3');mus.volume=.35;mus.onended=nx;const p=mus.play();if(p&&p.catch)p.catch(()=>{mus=null})};nx()}
const st=(x,c)=>`<div id=fit><div class="stage ${c||''}" ${c?'':'style="background-image:url(/domino/ps-bg.jpg)"'}>${x}</div></div>`;
const POS={1:['bl'],2:['bl','t'],3:['bl','t','r'],4:['bl','r','t','l'],5:['bl','br','r','t','l'],6:['bl','br','r','tr','tl','l']};
function render(v){let h='';
if(v.phase=='lobby'){const hu=v.pl.filter(p=>!p.bot),sl=[0,1,2,3,4,5].map(i=>{const p=hu[i];return p&&p.char>=0?`<div class=sl style="height:200px">${av(p.char)}${E(p.name)}</div>`:`<div class="sl e" style="height:200px">${p?'Eligiendo…':'Esperando…'}</div>`}).join('');
 h=st(`<div class=ttl>Dominó<small>Multijugador</small></div><div class=qr style="left:50px;top:150px;width:330px;font-size:22px"><div style="width:270px">${qr('unotv://'+HOST+'/sala?c='+v.code+'&g=domino')}</div>Con la app</div><div class=qr style="left:410px;top:150px;width:330px;font-size:22px"><div style="width:270px">${qr('http://'+HOST+'/domino-play.html?c='+v.code)}</div>Sin la app<small>${E(ip)}</small></div><div style="position:absolute;left:50px;top:610px;width:690px;text-align:center;font-size:44px;font-weight:900">Sala <span style="color:#ffd23f;letter-spacing:8px">${v.code}</span></div><div class=sls style="left:800px;top:150px;width:740px">${sl}</div><div class=tg style="left:800px">El 1.º en entrar inicia la partida desde su celu</div>`)}
else{const n=v.pl.length,ps=POS[n],cn=v.chain.length,rw=cn<=12?1:cn<=24?2:3,u=Math.max(12,Math.min(40,(1240/Math.ceil(Math.max(cn,1)/rw)-8)/2)),w=v.msg;let ov='';
 const seats=v.pl.map((p,i)=>`<div class="s ${ps[i]} ${i==v.turn&&v.phase=='play'?'act':''}"><div class=ab>${av(p.char)}<div class=nm style="--rc:${RC[p.char]}">${E(p.name)}<span>⭐ ${p.score}</span></div></div><div class=bks>${'<u class=bk></u>'.repeat(p.n)}</div></div>`).join('');
 if(v.phase=='round')ov=`<div class=ov><h1>🏆 ${E(w.name)}</h1><p>ganó la ronda · +${w.pts} ⭐</p><p style="font-size:34px">${v.pl.map(p=>E(p.name)+' '+p.score).join(' · ')}</p></div>`;
 if(v.phase=='end')ov=`<div class=ov><h1>🏆 ¡${E(w.name)} ganó!</h1><p>${v.pl.slice().sort((a,b)=>b.score-a.score).map(p=>E(p.name)+' ⭐'+p.score).join(' · ')}</p><p style="font-size:34px">REVANCHA desde el celular</p></div>`;
 h=st(`<div class=ttl>Dominó<small>Multijugador</small></div><div class=tbl>Mesa #${v.code}<br>👥 ${v.pl.filter(p=>!p.bot).length} + ${v.pl.filter(p=>p.bot).length} bots</div>${seats}<div class=brd style="--u:${u}px">${v.chain.map(t=>tile(t[0],t[1],t[0]==t[1])).join('')}</div><div class=turn>Turno de:<em>${E(v.pl[v.turn].name)}</em><i id=tb style="width:${v.left*5}%"></i></div>${ov}`,v.mesa=='g'?'g':'r')}
app.innerHTML=h;fit();
if(v.phase=='end'&&lastPh!='end'){if(mus)mus.volume=.12;try{new Audio('/sonidos/domino/winner.mp3').play()}catch(e){}}
if(v.phase!='end'&&lastPh=='end'&&mus)mus.volume=.35;
lastPh=v.phase}
window.onChange=()=>{try{render(JSON.parse(hostView('')))}catch(e){app.innerHTML='<pre style="color:#fff;background:#b00020;padding:2vh;font:2.2vh monospace;white-space:pre-wrap">Error en la pantalla de Dominó:\n'+E(String(e&&e.stack||e))+'</pre>'}try{Android.changed()}catch(e){}};
window.onTick=()=>{const b=$('#tb');if(b)b.style.width=S.left*5+'%'};
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.keyCode===23||e.keyCode===66)&&S.ph=='lobby'&&S.pl.some(p=>!p.bot))start()});
music();onChange();
</script></body></html>
