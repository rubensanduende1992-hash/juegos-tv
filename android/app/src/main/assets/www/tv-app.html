<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UNO TV</title><link rel="stylesheet" href="/style.css"></head>
<body><div id="app"></div><script src="/common.js"></script><script src="/host.js"></script><script>
urls=['http://'+Android.ip()+':3000/play.html'];let s;
window.onChange=()=>{s=JSON.parse(hostView(''));show();Android.changed()};
function show(){
if(s.phase==='lobby'){$('#app').innerHTML=`<div class="pn"><h1>🃏 UNO</h1><p>En la app del celular (Modo celular) escribí esta dirección:</p><h1 style="font-size:56px">${Android.ip()}</h1><p>Código de sala:</p><h1 style="font-size:72px;letter-spacing:10px">${s.code}</h1><div class="row">${s.players.map(p=>`<div class="lp"><span class="av">${CH[p.ch][0]}</span>${E(p.name)}</div>`).join('')||'Esperando jugadores…'}</div><p>Mazo: <b>${D[s.deck][0]}</b> (lo elige ${s.players[0]?E(s.players[0].name):'el Jugador 1'})</p>${bk(s.deck,'lg')}</div>`;return}
const n=s.players.length;
const seats=s.players.map((p,i)=>{const a=(90+i*360/n)*Math.PI/180;return `<div class="seat ${i==s.turn&&!s.over?'act':''}" style="left:${50+41*Math.cos(a)}%;top:${50+40*Math.sin(a)}%"><div class="av2">${CH[p.ch][0]}</div><b>${E(p.name)}</b><div class="mini">${'<u></u>'.repeat(Math.min(p.n,10))}<em>${p.n}</em></div><div>${p.sc} pts</div></div>`}).join('');
$('#app').innerHTML=`<div class="pn"><div class="table">${seats}<div class="ctr">${bk(s.deck,'lg')}${cardH(s.top,'lg')}<div class="cd" style="background:${CC[s.col]}"></div><div class="dir">${s.dir>0?'↻':'↺'}</div></div></div><div class="log">${E(s.log)} · mazo: ${s.drawN}</div>${s.over?`<div class="win">🏆 ${E(s.players[s.win.i].name)} gana la ronda (+${s.win.pts} pts)</div>`:''}</div>${s.shout!=null?`<div class="shout">¡UNO!<br>${CH[s.players[s.shout].ch][0]}</div>`:''}`}
onChange();
</script></body></html>
