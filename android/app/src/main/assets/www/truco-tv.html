#tb.hold{animation:tbh .6s ease forwards}@keyframes tbh{0%{transform:translate(-50%,-50%) scale(.5);opacity:0}100%{transform:translate(-50%,-50%) scale(1);opacity:1}}
#game{position:fixed;inset:0;background:#000;display:none}

<script src="/qr.js"></script><script src="/sonido.js"></script><script src="/truco-host.js"></script><script>const $=i=>document.getElementById(i),SG=$('stage');
const SLH=[[[{"cx": 696, "cy": 658, "m": "matrix3d(0.32454545, 0, 0, 0, -0.97578089, -0.5627972, 0, -0.0011655012, 0, 0, 1, 0, 691.9, 640.8, 0, 1)"}, {"cx": 739, "cy": 658, "m": "matrix3d(0.32363636, 0, 0, 0, -0.98550391, -0.57209927, 0, -0.0011792129, 0, 0, 1, 0, 731, 640.8, 0, 1)"}, {"cx": 783, "cy": 658, "m": "matrix3d(0.32454545, 0, 0, 0, -0.97526807, -0.5627972, 0, -0.0011655012, 0, 0, 1, 0, 770, 640.8, 0, 1)"}], [{"cx": 888, "cy": 658, "m": "matrix3d(0.32363636, 0, 0, 0, -0.98754971, -0.57209927, 0, -0.0011792129, 0, 0, 1, 0, 865.2, 640.8, 0, 1)"}, {"cx": 931, "cy": 658, "m": "matrix3d(0.32454545, 0, 0, 0, -0.97503497, -0.5627972, 0, -0.0011655012, 0, 0, 1, 0, 904.2, 640.8, 0, 1)"}, {"cx": 974, "cy": 658, "m": "matrix3d(0.32454545, 0, 0, 0, -0.97508159, -0.5627972, 0, -0.0011655012, 0, 0, 1, 0, 943.3, 640.8, 0, 1)"}]],[[608, 679], [1024, 616]]],SL=SLH[0],HAND=SLH[1];

function fit(){const s=Math.min(innerWidth/1672,innerHeight/941);SG.style.transform=`translate(${(innerWidth-1672*s)/2}px,${(innerHeight-941*s)/2}px) scale(${s})`}addEventListener('resize',fit);fit();
const qr0=(t)=>{const q=new __QR.QRCode(-1,__QR.ECL.M);q.addData(t);q.make();const n=q.getModuleCount(),m=4;let d='';for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))d+=`M${c+m},${r+m}h1v1h-1z`;return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${n+2*m} ${n+2*m}" shape-rendering="crispEdges" style="background:#fff;border-radius:12px"><path d="${d}" fill="#000"/></svg>`};
const qr=t=>{try{return qr0(t)}catch(e){return '<div>QR no disponible</div>'}};

urls=['http://'+ip+':3000/truco-play.html'];

function slot(p,k,t2){return p?`<div class="slot me ${t2?'t2':''}"><i>${k}</i>${Es(p.name)}</div>`:`<div class="slot empty"><i>${k}</i>Esperando jugador…</div>`}
function lobby(s){const host=new URL(s.urls[0]).host,P=s.players;let list;
 if(s.mode==='2v2')list=`<div class="tm">EQUIPO 1</div>${slot(P[0],1)}${slot(P[2],3)}<div class="tm">EQUIPO 2</div>${slot(P[1],2,1)}${slot(P[3],4,1)}`;else list=slot(P[0],1)+slot(P[1],2,1);

 $('p').innerHTML=`<h2>CÓDIGO DE SALA<span class="chip">${s.mode==='2v2'?'2 vs 2':'1 vs 1'}</span><span class="chip">a ${s.target}</span></h2><div class="code">${Es(s.code)}</div>

 <div class="pl">${list}</div><div class="st">${st}</div>`}

function pills(){[0,1].forEach(p=>{const t=$('pt'+p),n=$('np'+p);t.textContent=nm(p);t.style.transform='translate(-50%,-50%)';const w=Math.min(260,Math.max(168,t.offsetWidth+64));n.style.width=w+'px';n.style.left=(+n.dataset.cx-w/2)+'px';n.style.transform='none';t.style.transform=`translate(-50%,-50%) scaleX(${Math.min(1,(w-60)/t.offsetWidth)})`})}
const nm=p=>(V&&V.players[p]?V.players[p].name:'Jugador '+(p+1));

 $('n0').textContent=nm(0);$('n1').textContent=nm(1);$('s0').textContent=V.score[0];$('s1').textContent=V.score[1];$('tA').textContent='A';$('tT').textContent=V.target;$('tP').textContent='PUNTOS';
 $('k0').textContent=V.hands;$('k1').textContent=V.envPot||0;$('k2').textContent=V.tval||1;
 const t=V.over||V.ended?-1:(V.pend?1-V.pend.by:V.turn);[0,1].forEach(p=>{$('tu'+p).style.opacity=t===p?1:0;$('np'+p).classList.toggle('on',t===p);
  const n=shown[p];$('mc'+p).innerHTML=Array.from({length:n},()=>'<i></i>').join('')+`<span>${n} carta${n==1?'':'s'}</span>`});fitTxt();pills()}
function setFrame(p,f){document.querySelectorAll('#'+(p?'gau':'chi')+' img').forEach(m=>m.style.visibility=m.dataset.f==f?'visible':'hidden')}
const idle=()=>[0,1].forEach(p=>setFrame(p,'i'+Math.max(0,Math.min(3,shown[p]))));

function wrap(c,cls){const w=document.createElement('div');w.className=cls;const i=new Image();i.src='/cartas/'+c.s+'_'+c.n+'.png';i.draggable=false;w.append(i);return w}
const SLOT=(p,t)=>({cx:p?1032-60*t:640+60*t,cy:649});
function placeStatic(p,t,c){const k=p+'_'+t;if(SG.querySelector('.sc[data-k="'+k+'"]'))return;const o=SLOT(p,t),s=wrap(c,'sc');s.dataset.k=k;
 s.style.cssText=`left:${o.cx-36}px;top:${o.cy-57}px;width:72px;height:114px;transform-origin:50% 100%;transform:perspective(300px) rotateX(34deg) rotate(${p?3:-3}deg);z-index:${t+1}`;SG.insertBefore(s,$('chi'))}

function big(c,p){SG.querySelectorAll('.big').forEach(b=>b.remove());const b=wrap(c,'big');b.style.transform='translate(781px,395px) scale(.85)';SG.append(b);const cap=$('cap');cap.textContent=`${nm(p)} tiró: ${c.n} de ${PN[c.s]}`;cap.style.opacity=1;clearTimeout(bt);bt=setTimeout(()=>{b.style.opacity=0;cap.style.opacity=0},2000)}
function animPlay(e){const p=e.p,c=e.card,t=e.t,sl=SLOT(p,t),d=p?-1:1;
 setFrame(p,shown[p]>=2?'r2':'r1');
 const fly=()=>{const[x0,y0]=HAND[p],mx=(x0+sl.cx)/2,my=Math.min(y0,sl.cy)-200,T=(x,y,s,r)=>`translate(${x-55}px,${y-82}px) scale(${s}) rotate(${r}deg)`;
  const kf=o=>[{transform:T(x0,y0,.5,0),opacity:o},{transform:T(mx,my,1.05,d*200),offset:.45,opacity:o},{transform:T(sl.cx,sl.cy,.66,d*360),opacity:o}],opt={duration:750,easing:'cubic-bezier(.3,.6,.4,1)',fill:'both'};
  for(let i=3;i>=1;i--){const g=wrap(c,'fly');g.firstChild.style.filter='blur(2px)';SG.append(g);g.animate(kf(.28/i),{...opt,delay:i*45}).onfinish=()=>g.remove()}
  const f=wrap(c,'fly');SG.append(f);f.animate(kf(1),opt).onfinish=()=>{f.remove();placeStatic(p,t,c);big(c,p)}};
 setTimeout(()=>{setFrame(p,'x');fly()},220);
 setTimeout(()=>{shown[p]=Math.max(0,shown[p]-1);setFrame(p,'i'+shown[p]);hud()},800)}
/* ---------- carteles ---------- */
function banner(title,sub,p,hold){const b=$('tb');b.className='p'+p;b.querySelector('b').textContent=title;b.querySelector('s').textContent=sub||'';void b.offsetWidth;b.classList.add(hold?'hold':'show')}
function enqueue(fn,dur){queue.push([fn,dur]);if(!busy)run()}
function run(){const x=queue.shift();if(!x){busy=false;return}busy=true;let r;try{r=x[0]()}catch(e){}Promise.all([new Promise(res=>setTimeout(res,x[1])),r&&r.then?r:0]).then(run,run)}
function handle(e){
 if(e.type==='deal')enqueue(()=>{clearTable();$('tb').className='';shown=[3,3];idle();hud()},300);
 else if(e.type==='play')enqueue(()=>animPlay(e),1050);
 else if(e.type==='call')enqueue(()=>{banner(CALLN[e.k],nm(e.p).toUpperCase()+' CANTA',e.p);return SND.say(SEX[e.p],e.k)},1500);
 else if(e.type==='resp')enqueue(()=>{banner(e.r==='quiero'?'¡QUIERO!':'¡NO QUIERO!',nm(e.p).toUpperCase()+' RESPONDE',e.p);return SND.say(SEX[e.p],e.r)},1300);
 else if(e.type==='mazo')enqueue(()=>{banner('¡AL MAZO!',nm(e.p).toUpperCase(),e.p);return SND.say(SEX[e.p],'mazo')},1400);
 else if(e.type==='envido')enqueue(()=>envidoSeq(e),300);
 else if(e.type==='hand')enqueue(()=>banner('¡MANO PARA '+nm(e.w).toUpperCase()+'!','+'+e.pts+(e.pts==1?' PUNTO':' PUNTOS'),e.w),2600);
 else if(e.type==='game')enqueue(()=>{banner('¡GANÓ '+nm(e.w).toUpperCase()+'!','Revancha desde el celular',e.w,true);return SND.play('/sonidos/winner.mp3',1)},0)}
const SEX=['f','m'];
async function envidoSeq(e){const m=e.mano,o=1-m,wait=ms=>new Promise(r=>setTimeout(r,ms));
 if(e.refused){banner('+'+e.pot,'ENVIDO PARA '+nm(e.w).toUpperCase(),e.w);await wait(2000);return}
 const sum=()=>banner(e.pts[0]+' — '+e.pts[1],'ENVIDO PARA '+nm(e.w).toUpperCase()+' · +'+e.pot,e.w);
 if(e.auto){sum();await wait(2800);return}
 banner(String(e.pts[m]),nm(m).toUpperCase(),m);await SND.say(SEX[m],SND.num(e.pts[m]));await wait(250);
 if(e.w===o){banner(String(e.pts[o]),nm(o).toUpperCase(),o);await SND.say(SEX[o],SND.num(e.pts[o]));await wait(150);banner('LAS MÍAS SON MEJORES',nm(o).toUpperCase(),o);await SND.say(SEX[o],'mejores')}
 else{banner('SON BUENAS',nm(o).toUpperCase(),o);await SND.say(SEX[o],'buenas')}
 await wait(300);sum();await wait(2200)}
/* ---------- render ---------- */
function render(v){V=v;
 if(v.phase==='lobby'){$('game').style.display='none';$('lobby').style.display='flex';lobby(v);first=true;queue=[];busy=false;return}
 $('lobby').style.display='none';$('game').style.display='block';
 if(first){first=false;lastEv=v.evId;shown=v.counts?v.counts.slice():[3,3];clearTable();$('tb').className='';(v.table||[]).forEach((row,p)=>row.forEach((c,t)=>c&&placeStatic(p,t,c)));idle();hud();
  if(v.over)banner('¡GANÓ '+nm(v.over.winner).toUpperCase()+'!','Revancha desde el celular',v.over.winner,true);return}
 v.events.filter(e=>e.id>lastEv).forEach(handle);lastEv=v.evId;hud()}
window.onChange=()=>{try{render(JSON.parse(hostView('')))}catch(e){$('lobby').style.display='flex';$('p').innerHTML='<pre style="color:#fff;background:#b00020;padding:2vh;font:2.2vh monospace;white-space:pre-wrap">Error en la pantalla de Truco:\n'+Es(String(e&&e.stack||e))+'</pre>'}try{Android.changed()}catch(e){}};
document.fonts.ready.then(()=>{if(V)hud()});
SND.music();onChange();
</script></body></html>
